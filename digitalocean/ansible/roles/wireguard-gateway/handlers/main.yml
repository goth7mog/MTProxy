---
- name: Restart WireGuard
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted
    enabled: true

- name: Save firewall rules
  ansible.builtin.shell:
    cmd: iptables-save > /etc/iptables/rules.v4 && ip6tables-save > /etc/iptables/rules.v6
    executable: /bin/bash
